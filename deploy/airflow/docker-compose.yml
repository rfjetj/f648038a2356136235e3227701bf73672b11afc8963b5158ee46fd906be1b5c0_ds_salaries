# deploy/airflow/docker-compose.yml
# (no 'version:' line — it's obsolete)

x-airflow: &airflow
  build:
    context: ../..                 # ⟵ REPO ROOT (so /src exists for COPY)
    dockerfile: deploy/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Manila"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
  volumes:
    - ./airflow_home/airflow.db:/opt/airflow/airflow.db
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    # remove the src bind mount — we bake code into the image now
    # - ../../src:/opt/airflow/src:ro
    - ../../data:/opt/airflow/data
    - ../../models:/opt/airflow/models

services:
  webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8080:8080"

  scheduler:
    <<: *airflow
    command: scheduler
